name: Build macOS test
on:
  workflow_dispatch:
  push:
    branches: ['codex/mac-test-*']
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node --test scripts/test-platform-support.cjs scripts/test-app-updater.cjs
      - name: Build universal test installer without Developer ID
        run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: macOS-test-universal
          path: release/*/mac/*
          if-no-files-found: error
          retention-days: 14
      - name: Attach Mac installers to existing version release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release view "$VERSION" --repo "$GITHUB_REPOSITORY"
          gh release upload "$VERSION" release/"$VERSION"/mac/* --repo "$GITHUB_REPOSITORY"
          echo "Mac installers: https://github.com/$GITHUB_REPOSITORY/releases/tag/$VERSION" >> "$GITHUB_STEP_SUMMARY"
